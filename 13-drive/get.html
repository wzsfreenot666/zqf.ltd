<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b0d">
<title>取文件 · ZQF.DRIVE</title>
<style>
:root{--bg:#090b0d;--surface:#0e1114;--line:#242a30;--line-soft:#191e23;--txt:#edf1f3;--muted:#7b868f;--dim:#4d5861;--accent:#67d7e5;--mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--txt);font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);background-size:48px 48px;opacity:.2;mask-image:linear-gradient(to bottom,black,transparent 80%)}a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.card{width:min(520px,100%);border:1px solid var(--line);background:rgba(14,17,20,.9)}.top{padding:22px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font:700 14px var(--mono);letter-spacing:.08em}.bm{width:26px;height:26px;border:1px solid var(--accent);display:grid;place-items:center;color:var(--accent);font-size:11px}.tag{font:10px var(--mono);letter-spacing:.12em;color:var(--dim)}
.body{padding:40px 26px;text-align:center}.ic{width:60px;height:60px;margin:0 auto 22px;border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}.ic svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.4}.eyebrow{font:10px var(--mono);letter-spacing:.16em;color:var(--accent);margin-bottom:12px}.fname{font-size:20px;font-weight:600;word-break:break-all;line-height:1.4}.fmeta{font:11px var(--mono);color:var(--dim);margin-top:12px}.divider{height:1px;background:var(--line);margin:30px 0}.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--accent);color:#04181b;border:1px solid var(--accent);padding:14px 20px;font:600 13px var(--mono);letter-spacing:.06em;border-radius:2px;cursor:pointer}.btn:hover{opacity:.85}.btn:disabled{opacity:.4}.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6}.note{font:10px var(--mono);color:var(--dim);line-height:1.9;margin-top:20px}.err-t{font:600 18px var(--mono);color:var(--danger);margin-bottom:10px}.spin{width:26px;height:26px;margin:0 auto;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.loading{font:11px var(--mono);color:var(--dim);margin-top:16px}
.foot{padding:18px 26px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font:10px var(--mono);color:var(--dim);letter-spacing:.06em}.foot a{color:var(--muted)}.foot a:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="card">
  <div class="top"><div class="brand"><span class="bm">Z/</span>ZQF.DRIVE</div><div class="tag">SHARED FILE</div></div>
  <div class="body" id="body"><div class="spin"></div><div class="loading">正在读取文件信息…</div></div>
  <div class="foot"><span>POWERED BY CLOUDFLARE WORKERS</span><a href="./index.html">管理文件 ↗</a></div>
</div>
<script>
const API='https://api.zqf.ltd/';
const $=id=>document.getElementById(id);
const code=new URLSearchParams(location.search).get('code')||'';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const human=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(2)+' GB';
const fmt=s=>{const d=new Date(s);return isNaN(d)?'':`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};

function icon(){return '<svg viewBox="0 0 48 48"><path d="M24 6v24m0 0l-9-9m9 9l9-9M8 34v6h32v-6"/></svg>';}

function err(title,desc){
  $('body').innerHTML=`<div class="ic" style="color:var(--danger)"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="17"/><path d="M24 14v12M24 32v2"/></svg></div><div class="err-t">${esc(title)}</div><div class="fmeta">${esc(desc)}</div>`;
}

async function init(){
  if(!/^[0-9a-f]{32}$/.test(code)){ err('链接无效','分享码格式不正确，请检查链接是否完整。'); return; }
  let r;
  try{ r=await (await fetch(`${API}?action=info&code=${code}`)).json(); }
  catch{ err('无法连接','网络错误，请稍后再试。'); return; }
  if(!r.ok){ err('文件不可用',r.error||'文件可能已被删除。'); return; }
  const dl=`${API}?action=get&code=${code}&dl=1`;
  const view=`${API}?action=get&code=${code}`;
  const image=/^image\//.test(r.type);
  $('body').innerHTML=`
    <div class="ic">${icon()}</div>
    <div class="eyebrow">FILE READY</div>
    <div class="fname">${esc(r.name)}</div>
    <div class="fmeta">${human(r.size)} · 上传于 ${fmt(r.uploaded)}</div>
    <div class="divider"></div>
    <a class="btn" href="${dl}" download="${esc(r.name)}"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 19h16"/></svg>下载文件</a>
    <div class="note">${image?`<a href="${view}" target="_blank" style="color:var(--muted)">在线预览 ↗</a><br>`:''}此链接由分享码生成，拿到链接即可下载。文件来自 ZQF.DRIVE 云端存储。</div>`;
}
init();
</script>
</body>
</html>
