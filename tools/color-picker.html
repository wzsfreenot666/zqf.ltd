<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>颜色选择器 - zqf.ltd</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/" class="navbar-brand"><span class="brand-text">zqf<span class="accent">.ltd</span></span></a>
    <ul class="navbar-nav">
      <li><a href="/">首页</a></li>
      <li><a href="/tools/utility.html" class="active">实用工具</a></li>
      <li><a href="/tools/fun.html">趣味工具</a></li>
      <li><a href="/tools/text.html">文本工具</a></li>
      <li><a href="/tools/storage.html">文件存储</a></li>
      <li><a href="/deploy.html">部署教程</a></li>
    </ul>
  </div>
</nav>

<div class="container tool-page">
  <div class="tool-header">
    <a href="/" class="back">&larr; 返回首页</a>
    <h1>颜色选择器</h1>
    <p>取色并获取 HEX / RGB / HSL 格式值</p>
  </div>

  <div class="tool-content">
    <div style="display:flex; gap:32px; align-items:flex-start; flex-wrap:wrap;">
      <div>
        <input type="color" id="colorPicker" value="#4263eb" style="width:200px; height:200px; border:1px solid var(--border); border-radius:12px; cursor:pointer;" oninput="update()">
      </div>

      <div style="flex:1; min-width:280px;">
        <div style="margin-bottom:20px;">
          <label style="font-size:13px; color:var(--text-secondary); display:block; margin-bottom:6px;">HEX</label>
          <div style="display:flex; gap:8px;">
            <input type="text" id="hex" value="#4263eb" readonly style="font-family:monospace;">
            <button class="btn btn-secondary" onclick="copy('hex')">复制</button>
          </div>
        </div>

        <div style="margin-bottom:20px;">
          <label style="font-size:13px; color:var(--text-secondary); display:block; margin-bottom:6px;">RGB</label>
          <div style="display:flex; gap:8px;">
            <input type="text" id="rgb" readonly style="font-family:monospace;">
            <button class="btn btn-secondary" onclick="copy('rgb')">复制</button>
          </div>
        </div>

        <div style="margin-bottom:20px;">
          <label style="font-size:13px; color:var(--text-secondary); display:block; margin-bottom:6px;">HSL</label>
          <div style="display:flex; gap:8px;">
            <input type="text" id="hsl" readonly style="font-family:monospace;">
            <button class="btn btn-secondary" onclick="copy('hsl')">复制</button>
          </div>
        </div>

        <div id="preview" style="width:100%; height:60px; border-radius:8px; border:1px solid var(--border);"></div>
      </div>
    </div>
  </div>
</div>

<script>
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return { r, g, b };
}

function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h, s, l = (max + min) / 2;
  if (max === min) { h = s = 0; }
  else {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch(max) {
      case r: h = (g - b) / d + (g < b ? 6 : 0); break;
      case g: h = (b - r) / d + 2; break;
      case b: h = (r - g) / d + 4; break;
    }
    h /= 6;
  }
  return { h: Math.round(h*360), s: Math.round(s*100), l: Math.round(l*100) };
}

function update() {
  const hex = document.getElementById('colorPicker').value;
  const { r, g, b } = hexToRgb(hex);
  const { h, s, l } = rgbToHsl(r, g, b);
  document.getElementById('hex').value = hex.toUpperCase();
  document.getElementById('rgb').value = `rgb(${r}, ${g}, ${b})`;
  document.getElementById('hsl').value = `hsl(${h}, ${s}%, ${l}%)`;
  document.getElementById('preview').style.background = hex;
}

function copy(field) {
  const val = document.getElementById(field).value;
  navigator.clipboard.writeText(val);
  showToast('已复制: ' + val);
}

update();
</script>

</body>
</html>
