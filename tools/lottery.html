<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>随机抽奖 - zqf.ltd</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .winner-display {
      text-align:center; padding:48px 24px; background:var(--bg-secondary);
      border-radius:var(--radius-lg); margin:24px 0; min-height:120px;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
    }
    .winner-name {
      font-size:32px; font-weight:800; color:var(--primary);
      animation: pop 0.4s ease;
    }
    @keyframes pop { 0% { transform:scale(0.5); opacity:0; } 100% { transform:scale(1); opacity:1; } }
    .rolling-text { font-size:20px; color:var(--text-secondary); font-weight:600; }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/" class="navbar-brand"><span class="brand-text">zqf<span class="accent">.ltd</span></span></a>
    <ul class="navbar-nav">
      <li><a href="/">首页</a></li>
      <li><a href="/tools/utility.html">实用工具</a></li>
      <li><a href="/tools/fun.html" class="active">趣味工具</a></li>
      <li><a href="/tools/text.html">文本工具</a></li>
      <li><a href="/tools/storage.html">文件存储</a></li>
      <li><a href="/deploy.html">部署教程</a></li>
    </ul>
  </div>
</nav>

<div class="container tool-page">
  <div class="tool-header">
    <a href="/" class="back">&larr; 返回首页</a>
    <h1>随机抽奖</h1>
    <p>输入名单，随机抽取幸运者</p>
  </div>

  <div class="tool-content">
    <div style="margin-bottom:20px;">
      <label style="font-size:14px; font-weight:600; display:block; margin-bottom:8px;">参与名单（每行一个）：</label>
      <textarea id="names" placeholder="张三&#10;李四&#10;王五&#10;赵六" style="min-height:160px;">Alice
Bob
Charlie
Diana
Edward</textarea>
    </div>

    <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-bottom:24px;">
      <div>
        <label style="font-size:14px; font-weight:600; margin-right:8px;">抽取人数:</label>
        <input type="number" id="winnerCount" value="1" min="1" style="width:80px; font-family:monospace;">
      </div>
      <div>
        <label style="font-size:14px; font-weight:600; margin-right:8px;">不重复:</label>
        <input type="checkbox" id="unique" checked>
      </div>
    </div>

    <div class="winner-display" id="winnerDisplay">
      <div style="font-size:15px; color:var(--text-muted);">点击下方按钮开始抽奖</div>
    </div>

    <div style="display:flex; gap:12px; justify-content:center;">
      <button class="btn btn-primary" style="font-size:16px; padding:14px 40px;" onclick="draw()">开始抽奖</button>
      <button class="btn btn-secondary" onclick="reset()">重置</button>
    </div>

    <div id="historyBox" style="margin-top:24px; display:none;">
      <h3 style="font-size:15px; font-weight:600; margin-bottom:12px;">历次结果</h3>
      <div id="history"></div>
    </div>
  </div>
</div>

<script>
let history = [];
let isRolling = false;

function draw() {
  if (isRolling) return;
  const text = document.getElementById('names').value.trim();
  if (!text) { showToast('请先输入名单'); return; }
  let names = text.split('\n').map(n => n.trim()).filter(n => n);
  if (names.length < 2) { showToast('至少需要 2 个名字'); return; }

  const count = Math.min(parseInt(document.getElementById('winnerCount').value) || 1, names.length);
  const unique = document.getElementById('unique').checked;
  const display = document.getElementById('winnerDisplay');

  isRolling = true;
  let ticks = 0;
  const interval = setInterval(() => {
    display.innerHTML = '<div class="rolling-text">' + names[Math.floor(Math.random()*names.length)] + '</div>';
    ticks++;
    if (ticks >= 20) {
      clearInterval(interval);
      let winners = [];
      let pool = [...names];
      for (let i = 0; i < count; i++) {
        if (pool.length === 0) break;
        const idx = Math.floor(Math.random() * pool.length);
        winners.push(pool[idx]);
        if (unique) pool.splice(idx, 1);
      }
      display.innerHTML = '<div style="font-size:13px; color:var(--text-secondary); margin-bottom:8px;">幸运者</div>' +
        winners.map(w => '<div class="winner-name">' + w + '</div>').join('');
      history.unshift(winners.join(', '));
      updateHistory();
      isRolling = false;
    }
  }, 60);
}

function updateHistory() {
  const box = document.getElementById('historyBox');
  const list = document.getElementById('history');
  if (history.length === 0) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  list.innerHTML = history.map((h, i) =>
    `<div class="file-item"><span class="file-icon">&#127942;</span><div class="file-info"><div class="file-name">${h}</div><div class="file-meta">第 ${history.length - i} 次</div></div></div>`
  ).join('');
}

function reset() {
  history = [];
  document.getElementById('winnerDisplay').innerHTML = '<div style="font-size:15px; color:var(--text-muted);">点击下方按钮开始抽奖</div>';
  updateHistory();
}
</script>

</body>
</html>
