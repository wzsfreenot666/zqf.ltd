<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片压缩 - zqf.ltd</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/" class="navbar-brand"><span class="brand-text">zqf<span class="accent">.ltd</span></span></a>
    <ul class="navbar-nav">
      <li><a href="/">首页</a></li>
      <li><a href="/tools/utility.html" class="active">实用工具</a></li>
      <li><a href="/tools/fun.html">趣味工具</a></li>
      <li><a href="/tools/text.html">文本工具</a></li>
      <li><a href="/tools/storage.html">文件存储</a></li>
      <li><a href="/deploy.html">部署教程</a></li>
    </ul>
  </div>
</nav>

<div class="container tool-page">
  <div class="tool-header">
    <a href="/" class="back">&larr; 返回首页</a>
    <h1>图片压缩</h1>
    <p>在线压缩 JPG/PNG/WebP 图片，支持调整质量和尺寸</p>
  </div>

  <div class="tool-content">
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <div class="dz-icon">&#128247;</div>
      <div class="dz-text">点击或拖拽图片到此处</div>
      <div class="dz-hint">支持 JPG / PNG / WebP，最大 20MB</div>
      <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(this.files[0])">
    </div>

    <div id="controls" style="display:none; margin-top:24px;">
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-value" id="origSize">0</div>
          <div class="stat-label">原始大小</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="newSize">0</div>
          <div class="stat-label">压缩后大小</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="ratio">0%</div>
          <div class="stat-label">压缩率</div>
        </div>
      </div>

      <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-bottom:20px;">
        <label style="font-size:14px; font-weight:600;">压缩质量:</label>
        <input type="range" id="quality" min="10" max="100" value="70" style="flex:1; min-width:200px;" oninput="compress()">
        <span id="qualityVal" style="font-size:14px; font-weight:600; min-width:48px;">70%</span>
      </div>

      <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-bottom:20px;">
        <label style="font-size:14px; font-weight:600;">输出格式:</label>
        <select id="format" style="width:auto;" onchange="compress()">
          <option value="image/jpeg">JPEG</option>
          <option value="image/webp">WebP</option>
          <option value="image/png">PNG</option>
        </select>
      </div>

      <div style="display:flex; gap:12px;">
        <canvas id="canvas" style="max-width:100%; border:1px solid var(--border); border-radius:8px;"></canvas>
      </div>

      <div style="margin-top:20px; display:flex; gap:12px;">
        <button class="btn btn-primary" onclick="download()">下载压缩图片</button>
        <button class="btn btn-secondary" onclick="reset()">重新选择</button>
      </div>
    </div>
  </div>
</div>

<script>
let origFile = null;
let compressedBlob = null;

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(2) + ' MB';
}

function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) {
    showToast('请选择图片文件');
    return;
  }
  if (file.size > 20 * 1048576) {
    showToast('图片不能超过 20MB');
    return;
  }
  origFile = file;
  document.getElementById('origSize').textContent = formatSize(file.size);
  document.getElementById('dropZone').style.display = 'none';
  document.getElementById('controls').style.display = 'block';
  compress();
}

function compress() {
  if (!origFile) return;
  const q = document.getElementById('quality').value;
  const fmt = document.getElementById('format').value;
  document.getElementById('qualityVal').textContent = q + '%';

  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      canvas.toBlob(function(blob) {
        compressedBlob = blob;
        document.getElementById('newSize').textContent = formatSize(blob.size);
        const r = Math.round((1 - blob.size / origFile.size) * 100);
        document.getElementById('ratio').textContent = r + '%';
      }, fmt, q / 100);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(origFile);
}

function download() {
  if (!compressedBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(compressedBlob);
  const ext = document.getElementById('format').value === 'image/webp' ? 'webp' :
              document.getElementById('format').value === 'image/png' ? 'png' : 'jpg';
  a.download = 'compressed.' + ext;
  a.click();
  showToast('下载成功');
}

function reset() {
  origFile = null;
  compressedBlob = null;
  document.getElementById('dropZone').style.display = '';
  document.getElementById('controls').style.display = 'none';
  document.getElementById('fileInput').value = '';
}
</script>

</body>
</html>
