<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>二维码生成 - zqf.ltd</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/" class="navbar-brand"><span class="brand-text">zqf<span class="accent">.ltd</span></span></a>
    <ul class="navbar-nav">
      <li><a href="/">首页</a></li>
      <li><a href="/tools/utility.html" class="active">实用工具</a></li>
      <li><a href="/tools/fun.html">趣味工具</a></li>
      <li><a href="/tools/text.html">文本工具</a></li>
      <li><a href="/tools/storage.html">文件存储</a></li>
      <li><a href="/deploy.html">部署教程</a></li>
    </ul>
  </div>
</nav>

<div class="container tool-page">
  <div class="tool-header">
    <a href="/" class="back">&larr; 返回首页</a>
    <h1>二维码生成</h1>
    <p>输入文本或链接，生成可下载的二维码</p>
  </div>

  <div class="tool-content">
    <div style="margin-bottom:20px;">
      <label style="font-size:14px; font-weight:600; display:block; margin-bottom:8px;">输入内容：</label>
      <textarea id="inputText" placeholder="输入文本或URL..." style="min-height:100px;" oninput="generate()">https://zqf.ltd</textarea>
    </div>

    <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-bottom:24px;">
      <div>
        <label style="font-size:14px; font-weight:600; margin-right:8px;">尺寸:</label>
        <select id="size" style="width:auto;" onchange="generate()">
          <option value="128">128px</option>
          <option value="200" selected>200px</option>
          <option value="300">300px</option>
          <option value="400">400px</option>
          <option value="500">500px</option>
        </select>
      </div>
      <div>
        <label style="font-size:14px; font-weight:600; margin-right:8px;">前景色:</label>
        <input type="color" id="fgColor" value="#000000" style="width:44px; height:32px; border:1px solid var(--border); border-radius:4px; cursor:pointer;" onchange="generate()">
      </div>
      <div>
        <label style="font-size:14px; font-weight:600; margin-right:8px;">背景色:</label>
        <input type="color" id="bgColor" value="#ffffff" style="width:44px; height:32px; border:1px solid var(--border); border-radius:4px; cursor:pointer;" onchange="generate()">
      </div>
    </div>

    <div style="text-align:center; margin-bottom:20px;">
      <canvas id="canvas" style="border:1px solid var(--border); border-radius:8px;"></canvas>
    </div>

    <div style="display:flex; gap:12px; justify-content:center;">
      <button class="btn btn-primary" onclick="download()">下载 PNG</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
function generate() {
  const text = document.getElementById('inputText').value.trim() || ' ';
  const size = parseInt(document.getElementById('size').value);
  const fg = document.getElementById('fgColor').value;
  const bg = document.getElementById('bgColor').value;
  const canvas = document.getElementById('canvas');

  QRCode.toCanvas(canvas, text, {
    width: size,
    margin: 2,
    color: { dark: fg, light: bg }
  }, function(err) {
    if (err) showToast('生成失败：内容过长');
  });
}

function download() {
  const canvas = document.getElementById('canvas');
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'qrcode.png';
  a.click();
  showToast('下载成功');
}

generate();
</script>

</body>
</html>
