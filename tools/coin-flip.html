<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抛硬币 - zqf.ltd</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .coin {
      width:160px; height:160px; border-radius:50%; margin:32px auto;
      display:flex; align-items:center; justify-content:center;
      font-size:60px; font-weight:800; cursor:pointer; user-select:none;
      transition:transform 0.3s; border:3px solid var(--border);
    }
    .coin.heads { background:#FEF3C7; border-color:#F59E0B; color:#92400E; }
    .coin.tails { background:#DBEAFE; border-color:#3B82F6; color:#1E40AF; }
    .coin.flipping { animation: flip 0.6s ease-in-out; }
    @keyframes flip {
      0% { transform: rotateY(0deg) scale(1); }
      50% { transform: rotateY(540deg) scale(1.3); }
      100% { transform: rotateY(1080deg) scale(1); }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/" class="navbar-brand"><span class="brand-text">zqf<span class="accent">.ltd</span></span></a>
    <ul class="navbar-nav">
      <li><a href="/">首页</a></li>
      <li><a href="/tools/utility.html">实用工具</a></li>
      <li><a href="/tools/fun.html" class="active">趣味工具</a></li>
      <li><a href="/tools/text.html">文本工具</a></li>
      <li><a href="/tools/storage.html">文件存储</a></li>
      <li><a href="/deploy.html">部署教程</a></li>
    </ul>
  </div>
</nav>

<div class="container tool-page">
  <div class="tool-header">
    <a href="/" class="back">&larr; 返回首页</a>
    <h1>抛硬币</h1>
    <p>正反面随机，帮你做决定</p>
  </div>

  <div class="tool-content" style="text-align:center;">
    <div class="coin heads" id="coin" onclick="flip()">&#9733;</div>

    <div id="result" style="font-size:20px; font-weight:700; margin-bottom:24px; min-height:28px;">点击硬币开始抛</div>

    <div class="stats-row" style="justify-content:center;">
      <div class="stat-card">
        <div class="stat-value" id="headsCount">0</div>
        <div class="stat-label">正面</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="tailsCount">0</div>
        <div class="stat-label">反面</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalCount">0</div>
        <div class="stat-label">总次数</div>
      </div>
    </div>

    <button class="btn btn-primary" style="font-size:16px; padding:14px 40px;" onclick="flip()">抛硬币</button>
    <button class="btn btn-secondary" onclick="resetStats()">重置统计</button>
  </div>
</div>

<script>
let heads = 0, tails = 0;
let isFlipping = false;

function flip() {
  if (isFlipping) return;
  isFlipping = true;
  const coin = document.getElementById('coin');
  const result = document.getElementById('result');
  coin.classList.add('flipping');

  setTimeout(() => {
    const isHeads = Math.random() < 0.5;
    coin.classList.remove('flipping');
    if (isHeads) {
      coin.className = 'coin heads';
      coin.innerHTML = '&#9733;';
      result.textContent = '正面！';
      result.style.color = '#92400E';
      heads++;
    } else {
      coin.className = 'coin tails';
      coin.innerHTML = '&#9679;';
      result.textContent = '反面！';
      result.style.color = '#1E40AF';
      tails++;
    }
    document.getElementById('headsCount').textContent = heads;
    document.getElementById('tailsCount').textContent = tails;
    document.getElementById('totalCount').textContent = heads + tails;
    isFlipping = false;
  }, 600);
}

function resetStats() {
  heads = 0; tails = 0;
  document.getElementById('headsCount').textContent = '0';
  document.getElementById('tailsCount').textContent = '0';
  document.getElementById('totalCount').textContent = '0';
  document.getElementById('result').textContent = '点击硬币开始抛';
  document.getElementById('result').style.color = '';
}
</script>

</body>
</html>
