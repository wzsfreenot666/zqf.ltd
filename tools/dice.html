<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>掷骰子 - zqf.ltd</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .dice-container { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin:32px 0; }
    .dice {
      width:80px; height:80px; background:white; border:2px solid var(--border);
      border-radius:16px; display:flex; align-items:center; justify-content:center;
      font-size:40px; cursor:pointer; transition:transform 0.3s; user-select:none;
    }
    .dice.rolling { animation: shake 0.15s infinite; }
    @keyframes shake {
      0% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-10deg) scale(1.1); }
      50% { transform: rotate(10deg) scale(1.05); }
      75% { transform: rotate(-5deg) scale(1.08); }
      100% { transform: rotate(0deg) scale(1); }
    }
    .dice-dots { display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); width:56px; height:56px; gap:4px; }
    .dot { width:12px; height:12px; border-radius:50%; background:var(--text); justify-self:center; align-self:center; }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/" class="navbar-brand"><span class="brand-text">zqf<span class="accent">.ltd</span></span></a>
    <ul class="navbar-nav">
      <li><a href="/">首页</a></li>
      <li><a href="/tools/utility.html">实用工具</a></li>
      <li><a href="/tools/fun.html" class="active">趣味工具</a></li>
      <li><a href="/tools/text.html">文本工具</a></li>
      <li><a href="/tools/storage.html">文件存储</a></li>
      <li><a href="/deploy.html">部署教程</a></li>
    </ul>
  </div>
</nav>

<div class="container tool-page">
  <div class="tool-header">
    <a href="/" class="back">&larr; 返回首页</a>
    <h1>掷骰子</h1>
    <p>1-6 面骰子随机掷出，支持多骰同时掷</p>
  </div>

  <div class="tool-content" style="text-align:center;">
    <div style="margin-bottom:24px;">
      <label style="font-size:14px; font-weight:600; margin-right:8px;">骰子数量:</label>
      <select id="diceCount" style="width:auto;" onchange="setup()">
        <option value="1">1 个</option>
        <option value="2" selected>2 个</option>
        <option value="3">3 个</option>
        <option value="4">4 个</option>
        <option value="5">5 个</option>
        <option value="6">6 个</option>
      </select>
    </div>

    <div class="dice-container" id="diceContainer"></div>

    <div class="stats-row" style="justify-content:center;">
      <div class="stat-card">
        <div class="stat-value" id="total">-</div>
        <div class="stat-label">总点数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="rollCount">0</div>
        <div class="stat-label">已掷次数</div>
      </div>
    </div>

    <button class="btn btn-primary" style="font-size:16px; padding:14px 40px;" onclick="rollAll()">掷骰子</button>
  </div>
</div>

<script>
const dicePatterns = {
  1: [4],
  2: [0, 8],
  3: [0, 4, 8],
  4: [0, 2, 6, 8],
  5: [0, 2, 4, 6, 8],
  6: [0, 2, 3, 5, 6, 8]
};

let rolls = 0;

function setup() {
  const count = parseInt(document.getElementById('diceCount').value);
  const container = document.getElementById('diceContainer');
  container.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const dice = document.createElement('div');
    dice.className = 'dice';
    dice.id = 'dice' + i;
    dice.innerHTML = renderDots(1);
    container.appendChild(dice);
  }
  document.getElementById('total').textContent = '-';
}

function renderDots(num) {
  const positions = dicePatterns[num];
  let html = '<div class="dice-dots">';
  for (let i = 0; i < 9; i++) {
    html += positions.includes(i) ? '<div class="dot"></div>' : '<div></div>';
  }
  html += '</div>';
  return html;
}

function rollAll() {
  const count = parseInt(document.getElementById('diceCount').value);
  let total = 0;
  for (let i = 0; i < count; i++) {
    const dice = document.getElementById('dice' + i);
    dice.classList.add('rolling');
    let interval = setInterval(() => {
      dice.innerHTML = renderDots(Math.floor(Math.random() * 6) + 1);
    }, 80);
    setTimeout(() => {
      clearInterval(interval);
      const result = Math.floor(Math.random() * 6) + 1;
      dice.innerHTML = renderDots(result);
      dice.classList.remove('rolling');
      total += result;
      if (i === count - 1) {
        document.getElementById('total').textContent = total;
        rolls++;
        document.getElementById('rollCount').textContent = rolls;
      }
    }, 500 + i * 100);
  }
}

setup();
</script>

</body>
</html>
