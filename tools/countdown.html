<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>倒计时器 - zqf.ltd</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .timer-display {
      text-align:center; padding:48px 24px; background:var(--bg-secondary);
      border-radius:var(--radius-lg); margin:24px 0;
    }
    .timer-text {
      font-size:72px; font-weight:800; font-family:'SF Mono','Fira Code','Consolas',monospace;
      color:var(--text); letter-spacing:4px;
    }
    .timer-text.warning { color:var(--danger); }
    .preset-btn {
      padding:8px 16px; border:1px solid var(--border); border-radius:8px;
      background:white; cursor:pointer; font-size:14px; transition:all 0.2s;
    }
    .preset-btn:hover { border-color:var(--primary); color:var(--primary); }
    .timer-fullscreen {
      position:fixed; top:0; left:0; width:100vw; height:100vh;
      background:var(--text); z-index:9999; display:none;
      align-items:center; justify-content:center; flex-direction:column;
    }
    .timer-fullscreen .timer-text { font-size:200px; color:#fff; }
    .timer-fullscreen .timer-text.warning { color:#ff6b6b; }
    .timer-fullscreen .close-btn {
      position:absolute; top:24px; right:24px; color:#fff; font-size:24px;
      cursor:pointer; background:none; border:none;
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/" class="navbar-brand"><span class="brand-text">zqf<span class="accent">.ltd</span></span></a>
    <ul class="navbar-nav">
      <li><a href="/">首页</a></li>
      <li><a href="/tools/utility.html">实用工具</a></li>
      <li><a href="/tools/fun.html" class="active">趣味工具</a></li>
      <li><a href="/tools/text.html">文本工具</a></li>
      <li><a href="/tools/storage.html">文件存储</a></li>
      <li><a href="/deploy.html">部署教程</a></li>
    </ul>
  </div>
</nav>

<div class="container tool-page">
  <div class="tool-header">
    <a href="/" class="back">&larr; 返回首页</a>
    <h1>倒计时器</h1>
    <p>设定时间，全屏倒计时，适合会议、演讲、工作</p>
  </div>

  <div class="tool-content">
    <div style="display:flex; gap:12px; justify-content:center; margin-bottom:20px; flex-wrap:wrap;">
      <button class="preset-btn" onclick="setPreset(60)">1 分钟</button>
      <button class="preset-btn" onclick="setPreset(300)">5 分钟</button>
      <button class="preset-btn" onclick="setPreset(600)">10 分钟</button>
      <button class="preset-btn" onclick="setPreset(900)">15 分钟</button>
      <button class="preset-btn" onclick="setPreset(1800)">30 分钟</button>
    </div>

    <div style="display:flex; gap:8px; justify-content:center; margin-bottom:24px; flex-wrap:wrap;">
      <input type="number" id="minInput" placeholder="分" style="width:80px; text-align:center;" min="0">
      <input type="number" id="secInput" placeholder="秒" style="width:80px; text-align:center;" min="0" max="59">
      <button class="btn btn-primary" onclick="setTime()">设定</button>
    </div>

    <div class="timer-display">
      <div class="timer-text" id="timerText">00:00</div>
    </div>

    <div style="display:flex; gap:12px; justify-content:center;">
      <button class="btn btn-primary" style="font-size:16px; padding:14px 32px;" id="startBtn" onclick="toggleTimer()">开始</button>
      <button class="btn btn-secondary" onclick="resetTimer()">重置</button>
      <button class="btn btn-secondary" onclick="toggleFullscreen()">全屏</button>
    </div>
  </div>
</div>

<div class="timer-fullscreen" id="fullscreen">
  <button class="close-btn" onclick="toggleFullscreen()">&times;</button>
  <div class="timer-text" id="timerTextFS">00:00</div>
</div>

<script>
let totalSec = 0;
let remaining = 0;
let interval = null;
let isRunning = false;

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function updateDisplay() {
  const text = formatTime(remaining);
  const el = document.getElementById('timerText');
  const elFS = document.getElementById('timerTextFS');
  el.textContent = text;
  elFS.textContent = text;
  if (remaining <= 10 && remaining > 0) {
    el.classList.add('warning');
    elFS.classList.add('warning');
  } else {
    el.classList.remove('warning');
    elFS.classList.remove('warning');
  }
}

function setPreset(sec) {
  totalSec = sec;
  remaining = sec;
  resetTimer();
  updateDisplay();
}

function setTime() {
  const m = parseInt(document.getElementById('minInput').value) || 0;
  const s = parseInt(document.getElementById('secInput').value) || 0;
  totalSec = m * 60 + s;
  remaining = totalSec;
  resetTimer();
  updateDisplay();
}

function toggleTimer() {
  if (remaining === 0) {
    showToast('请先设定时间');
    return;
  }
  isRunning = !isRunning;
  const btn = document.getElementById('startBtn');
  if (isRunning) {
    btn.textContent = '暂停';
    interval = setInterval(() => {
      remaining--;
      updateDisplay();
      if (remaining <= 0) {
        clearInterval(interval);
        isRunning = false;
        btn.textContent = '开始';
        showToast('时间到！');
        if (document.fullscreenElement) toggleFullscreen();
      }
    }, 1000);
  } else {
    btn.textContent = '继续';
    clearInterval(interval);
  }
}

function resetTimer() {
  clearInterval(interval);
  isRunning = false;
  remaining = totalSec;
  document.getElementById('startBtn').textContent = '开始';
  updateDisplay();
}

function toggleFullscreen() {
  const fs = document.getElementById('fullscreen');
  if (fs.style.display === 'flex') {
    fs.style.display = 'none';
  } else {
    fs.style.display = 'flex';
  }
}

updateDisplay();
</script>

</body>
</html>
