<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>字数统计 - zqf.ltd</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/" class="navbar-brand"><span class="brand-text">zqf<span class="accent">.ltd</span></span></a>
    <ul class="navbar-nav">
      <li><a href="/">首页</a></li>
      <li><a href="/tools/utility.html">实用工具</a></li>
      <li><a href="/tools/fun.html">趣味工具</a></li>
      <li><a href="/tools/text.html" class="active">文本工具</a></li>
      <li><a href="/tools/storage.html">文件存储</a></li>
      <li><a href="/deploy.html">部署教程</a></li>
    </ul>
  </div>
</nav>

<div class="container tool-page">
  <div class="tool-header">
    <a href="/" class="back">&larr; 返回首页</a>
    <h1>字数统计</h1>
    <p>实时统计字符数、单词数、行数及阅读时间</p>
  </div>

  <div class="tool-content">
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-value" id="chars">0</div>
        <div class="stat-label">字符数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="charsNoSpace">0</div>
        <div class="stat-label">不含空格</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="words">0</div>
        <div class="stat-label">单词/词数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="lines">0</div>
        <div class="stat-label">行数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="readTime">0</div>
        <div class="stat-label">阅读时间(分)</div>
      </div>
    </div>

    <textarea id="input" placeholder="在此输入或粘贴文本..." oninput="count()" style="min-height:300px;"></textarea>
  </div>
</div>

<script>
function count() {
  const text = document.getElementById('input').value;
  const chars = text.length;
  const charsNoSpace = text.replace(/\s/g, '').length;
  const lines = text === '' ? 0 : text.split('\n').length;
  const chinese = (text.match(/[\u4e00-\u9fa5]/g) || []).length;
  const englishWords = (text.match(/[a-zA-Z]+/g) || []).length;
  const numbers = (text.match(/\d+/g) || []).length;
  const words = chinese + englishWords + numbers;
  const readTime = Math.ceil(words / 300);

  document.getElementById('chars').textContent = chars;
  document.getElementById('charsNoSpace').textContent = charsNoSpace;
  document.getElementById('words').textContent = words;
  document.getElementById('lines').textContent = lines;
  document.getElementById('readTime').textContent = readTime;
}
</script>

</body>
</html>
