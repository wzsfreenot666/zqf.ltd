<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文件存储 - zqf.ltd</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .storage-bar {
      display:flex; gap:16px; align-items:center; justify-content:space-between;
      padding:16px 20px; background:var(--bg-secondary); border-radius:8px; margin-bottom:24px; flex-wrap:wrap;
    }
    .storage-bar .storage-info { font-size:14px; color:var(--text-secondary); }
    .storage-bar .storage-info b { color:var(--text); font-size:16px; }
    .progress-bar { width:200px; height:8px; background:var(--border); border-radius:4px; overflow:hidden; }
    .progress-fill { height:100%; background:var(--primary); transition:width 0.3s; }
    .file-item .file-actions { display:flex; gap:8px; }
    .file-item .file-actions button {
      padding:4px 10px; border:1px solid var(--border); border-radius:6px;
      background:white; cursor:pointer; font-size:12px; transition:all 0.2s;
    }
    .file-item .file-actions button:hover { border-color:var(--primary); color:var(--primary); }
    .file-item .file-actions button.del:hover { border-color:var(--danger); color:var(--danger); }
    .empty-state { text-align:center; padding:48px 24px; color:var(--text-muted); }
    .empty-state .es-icon { font-size:48px; margin-bottom:12px; }
    .empty-state .es-text { font-size:16px; font-weight:600; margin-bottom:6px; color:var(--text-secondary); }
    .empty-state .es-hint { font-size:13px; }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/" class="navbar-brand"><span class="brand-text">zqf<span class="accent">.ltd</span></span></a>
    <ul class="navbar-nav">
      <li><a href="/">首页</a></li>
      <li><a href="/tools/utility.html">实用工具</a></li>
      <li><a href="/tools/fun.html">趣味工具</a></li>
      <li><a href="/tools/text.html">文本工具</a></li>
      <li><a href="/tools/storage.html" class="active">文件存储</a></li>
    </ul>
  </div>
</nav>

<div class="container tool-page">
  <div class="tool-header">
    <a href="/" class="back">&larr; 返回首页</a>
    <h1>文件存储</h1>
    <p>拖拽上传文件，文件存储在浏览器本地（IndexedDB），不上传到任何服务器</p>
  </div>

  <div class="tool-content">
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <div class="dz-icon">&#128229;</div>
      <div class="dz-text">点击或拖拽文件到此处</div>
      <div class="dz-hint">支持任意类型文件，单文件最大 50MB</div>
      <input type="file" id="fileInput" multiple style="display:none" onchange="handleFiles(this.files)">
    </div>

    <div class="storage-bar" id="storageBar" style="display:none;">
      <div class="storage-info">
        已存储 <b id="fileCount">0</b> 个文件，共 <b id="totalSize">0 B</b>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
        <span style="font-size:12px; color:var(--text-muted);" id="usagePercent">0%</span>
      </div>
      <button class="btn btn-danger" style="font-size:13px; padding:8px 16px;" onclick="clearAll()">清空全部</button>
    </div>

    <div class="file-list" id="fileList"></div>

    <div class="empty-state" id="emptyState">
      <div class="es-icon">&#128193;</div>
      <div class="es-text">还没有存储任何文件</div>
      <div class="es-hint">拖拽或点击上方区域上传文件</div>
    </div>
  </div>
</div>

<script>
const DB_NAME = 'zqf_storage';
const STORE = 'files';
const QUOTA = 200 * 1048576;

let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE)) {
        d.createObjectStore(STORE, { keyPath: 'id' });
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => reject(e);
  });
}

function addFile(file) {
  return new Promise((resolve, reject) => {
    const id = Date.now() + '_' + Math.random().toString(36).slice(2,8);
    const tx = db.transaction([STORE], 'readwrite');
    const store = tx.objectStore(STORE);
    const record = { id, name: file.name, size: file.size, type: file.type, date: new Date().toISOString(), blob: file };
    store.add(record);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function getAllFiles() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction([STORE], 'readonly');
    const store = tx.objectStore(STORE);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function deleteFile(id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction([STORE], 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function clearAllFiles() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction([STORE], 'readwrite');
    tx.objectStore(STORE).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function getFileIcon(type) {
  if (type.startsWith('image/')) return '&#128247;';
  if (type.startsWith('video/')) return '&#127910;';
  if (type.startsWith('audio/')) return '&#127925;';
  if (type.includes('pdf')) return '&#128196;';
  if (type.includes('zip') || type.includes('rar') || type.includes('7z')) return '&#128230;';
  if (type.includes('word') || type.includes('document')) return '&#128221;';
  if (type.includes('sheet') || type.includes('excel')) return '&#128202;';
  if (type.startsWith('text/')) return '&#128209;';
  return '&#128204;';
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
  return (bytes / 1073741824).toFixed(2) + ' GB';
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

async function renderList() {
  const files = await getAllFiles();
  files.sort((a,b) => new Date(b.date) - new Date(a.date));

  const list = document.getElementById('fileList');
  const empty = document.getElementById('emptyState');
  const bar = document.getElementById('storageBar');

  if (files.length === 0) {
    list.innerHTML = '';
    empty.style.display = '';
    bar.style.display = 'none';
    return;
  }

  empty.style.display = 'none';
  bar.style.display = '';

  let totalSize = 0;
  files.forEach(f => totalSize += f.size);

  document.getElementById('fileCount').textContent = files.length;
  document.getElementById('totalSize').textContent = formatSize(totalSize);
  const pct = Math.round(totalSize / QUOTA * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('usagePercent').textContent = pct + '% / ' + formatSize(QUOTA);

  list.innerHTML = files.map(f => `
    <div class="file-item">
      <span class="file-icon">${getFileIcon(f.type)}</span>
      <div class="file-info">
        <div class="file-name">${f.name}</div>
        <div class="file-meta">${formatSize(f.size)} &middot; ${formatDate(f.date)}</div>
      </div>
      <div class="file-actions">
        <button onclick="downloadFile('${f.id}')">下载</button>
        <button class="del" onclick="removeFile('${f.id}')">删除</button>
      </div>
    </div>
  `).join('');
}

async function handleFiles(fileList) {
  const files = Array.from(fileList);
  for (const file of files) {
    if (file.size > 50 * 1048576) {
      showToast(file.name + ' 超过 50MB，跳过');
      continue;
    }
    await addFile(file);
  }
  showToast(files.length + ' 个文件已存储');
  document.getElementById('fileInput').value = '';
  renderList();
}

async function downloadFile(id) {
  const tx = db.transaction([STORE], 'readonly');
  const req = tx.objectStore(STORE).get(id);
  req.onsuccess = () => {
    const f = req.result;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(f.blob);
    a.download = f.name;
    a.click();
    showToast('下载: ' + f.name);
  };
}

async function removeFile(id) {
  await deleteFile(id);
  showToast('已删除');
  renderList();
}

async function clearAll() {
  if (!confirm('确定要清空所有存储的文件吗？此操作不可恢复。')) return;
  await clearAllFiles();
  showToast('已清空全部文件');
  renderList();
}

const dz = document.getElementById('dropZone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
dz.addEventListener('drop', e => {
  e.preventDefault();
  dz.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});

openDB().then(() => renderList());
</script>

</body>
</html>
